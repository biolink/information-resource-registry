name: Regenerate Information Resource Registry Artifacts

# Controls when the action will run. Triggers the workflow on push
# event but only for the master branch, and specifically on the information_resource_registry.yaml
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * 1'  # at 07:00 UTC every Monday
  workflow_dispatch:
    types: trigger-build-artifacts

permissions:
  contents: write
  pull-requests: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          # Version range or exact version of a Python version to use, using SemVer's version range syntax.
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Information Resource Registry Artifacts
        run: |
          make gen-project
          make sankey
          make gendoc
          # test_pr runs last so the regenerated catalog is validated before
          # it is proposed; a failure here stops the job before any PR is opened
          make test_pr

      # main is a protected branch, so regenerated artifacts must land through
      # a pull request instead of a direct push. This action commits the
      # changed files to a dedicated branch and opens (or updates) a PR; when
      # regeneration produces no changes, it does nothing, which also keeps
      # the merge of that PR from re-triggering this workflow indefinitely.
      - name: Open pull request with regenerated artifacts
        uses: peter-evans/create-pull-request@v7
        with:
          # PRs created with the default GITHUB_TOKEN do not trigger the
          # pull_request workflows that provide the required status checks
          # (standardize, build). Configure a REGENERATE_ARTIFACTS_TOKEN
          # secret (a PAT with contents+pull-requests write) for full
          # automation; without it, close and reopen the PR to run the checks.
          token: ${{ secrets.REGENERATE_ARTIFACTS_TOKEN || github.token }}
          add-paths: |
            project
            src
            infores_catalog.yaml
          commit-message: Regenerate artifacts from infores_catalog.yaml
          branch: auto/regenerate-artifacts
          delete-branch: true
          author: GitHub Action <action@github.com>
          committer: GitHub Action <action@github.com>
          title: Regenerate artifacts from infores_catalog.yaml
          body: |
            Automated regeneration of registry artifacts by the
            "Regenerate Information Resource Registry Artifacts" workflow
            (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            `make test_pr` passed on the regenerated output before this PR
            was opened. If the required checks have not started, close and
            reopen this PR to trigger them.