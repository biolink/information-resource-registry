name: Regenerate Information Resource Registry Artifacts

# Controls when the action will run. Triggers the workflow on push
# event but only for the master branch, and specifically on the information_resource_registry.yaml
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * 1'  # at 07:00 UTC every Monday
  workflow_dispatch:
    types: trigger-build-artifacts

permissions:
  contents: write
  pull-requests: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          # Version range or exact version of a Python version to use, using SemVer's version range syntax.
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Information Resource Registry Artifacts
        run: |
          make gen-project
          make sankey
          make gendoc
          # test_pr runs last so the regenerated catalog is validated before
          # it is committed; running it earlier let a failing state be committed
          make test_pr

      - name: Create pull request for regenerated artifacts
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            project/
            src/
            infores_catalog.yaml
          branch: automation/regenerate-artifacts
          base: main
          commit-message: Regenerate artifacts from infores_catalog.yaml
          title: Regenerate Information Resource Registry artifacts
          body: |
            This pull request contains artifacts regenerated from `infores_catalog.yaml`.
          delete-branch: true
