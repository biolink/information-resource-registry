name: Auto-standardize catalog on PR

# Runs on every PR (no paths filter): the `standardize` job is a required status
# check on main, and a path-filtered workflow that never triggers reports no
# status at all, leaving the required check stuck at "Expected" and blocking
# merges of PRs that don't touch infores_catalog.yaml. When the catalog is
# unchanged the job finds no diff and succeeds in ~30s.
# See https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  standardize:
    # Skip forks
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run standardization
        run: make standardize-data

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- infores_catalog.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add infores_catalog.yaml
          git commit -m "Auto-standardize infores_catalog.yaml"
          git push
